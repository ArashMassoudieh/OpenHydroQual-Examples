# Rebuilds the catalog and example pages from examples/*/README.md and deploys site/ to GitHub Pages.
# Result plots are produced locally with `tools/build.py --run` (which needs the OpenHydroQual console)
# and committed under site/examples/<id>/; this workflow reuses them.
name: Deploy examples site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenHydroQual plugin definitions and guides
        uses: actions/checkout@v4
        with:
          repository: ArashMassoudieh/OpenHydroQual
          path: ohq
          sparse-checkout: |
            resources
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build
        run: python tools/build.py --resources ohq/resources --docs ohq/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
