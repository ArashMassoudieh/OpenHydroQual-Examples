<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 140 1120 366" class="ohq-diagram" style="max-width:560px" role="img" aria-label="Model diagram">
<defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-arrow"/></marker></defs>
<g class="d-link" data-name="Influent_to_Basin"><title>Influent_to_Basin (Fixed flow)</title><path d="M300.0 300.0 L400.0 300.0 L500.0 300.0" marker-mid="url(#arr)"/></g>
<g class="d-link" data-name="Basin_to_Effluent"><title>Basin_to_Effluent (Effluent flow)</title><path d="M700.0 300.0 L800.0 300.0 L900.0 300.0" marker-mid="url(#arr)"/></g>
