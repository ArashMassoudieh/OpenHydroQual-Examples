<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 770 766" class="ohq-diagram" style="max-width:385px" role="img" aria-label="Model diagram">
<defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-arrow"/></marker></defs>
<g class="d-link" data-name="Snowmelt"><title>Snowmelt (Snowmelt_link)</title><path d="M100.0 200.0 L100.0 300.0 L100.0 400.0" marker-mid="url(#arr)"/></g>
<g class="d-link" data-name="Runoff"><title>Runoff (Catchment_link)</title><path d="M200.0 500.0 L325.0 500.0 L450.0 500.0" marker-mid="url(#arr)"/></g>
<g class="d-node" data-name="Snowpack"><title>Snowpack (Snowpack)</title><rect x="0" y="0" width="200" height="200" rx="16"/>
<image href="icons/snowmelt.png" x="22" y="22" width="156" height="156"/>
<text x="100" y="222" font-size="17" text-anchor="middle">Snowpack</text></g>
<g class="d-node" data-name="Land_surface"><title>Land_surface (Catchment)</title><rect x="0" y="400" width="200" height="200" rx="16"/>
<image href="icons/rainwater-catchment.png" x="22" y="422" width="156" height="156"/>
<text x="100" y="622" font-size="17" text-anchor="middle">Land_surface</text></g>
<g class="d-node" data-name="Outlet"><title>Outlet (fixed_head)</title><rect x="450" y="400" width="200" height="200" rx="16"/>
<image href="icons/fixedhead.png" x="472" y="422" width="156" height="156"/>
<text x="550" y="622" font-size="17" text-anchor="middle">Outlet</text></g>
</svg>