<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 340 1120 366" class="ohq-diagram" style="max-width:560px" role="img" aria-label="Model diagram">
<defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-arrow"/></marker></defs>
<g class="d-link" data-name="Feed"><title>Feed (Fixed flow)</title><path d="M200.0 500.0 L300.0 500.0 L400.0 500.0" marker-mid="url(#arr)"/></g>
<g class="d-link" data-name="Discharge"><title>Discharge (Fixed flow)</title><path d="M600.0 500.0 L700.0 500.0 L800.0 500.0" marker-mid="url(#arr)"/></g>
<g class="d-node" data-name="Influent"><title>Influent (Reactor)</title><rect x="0" y="400" width="200" height="200" rx="16"/>
<image href="icons/reactor.png" x="22" y="422" width="156" height="156"/>
<text x="100" y="621" font-size="16" text-anchor="middle">Influent</text></g>
<g class="d-node composite" data-name="PFR"><title>PFR (Plug flow reactor)</title><rect x="400" y="400" width="200" height="200" rx="16"/>
<image href="icons/plug_flow_reactor.png" x="422" y="422" width="156" height="156"/>
<text x="500" y="621" font-size="16" text-anchor="middle">PFR</text></g>
<g class="d-node" data-name="Effluent"><title>Effluent (Reactor)</title><rect x="800" y="400" width="200" height="200" rx="16"/>
<image href="icons/reactor.png" x="822" y="422" width="156" height="156"/>
<text x="900" y="621" font-size="16" text-anchor="middle">Effluent</text></g>
</svg>